name: secrets and github Env variables

on:
  workflow_dispatch:

jobs:

  repo_secretsAndEvent:
    runs-on: ubuntu-latest
    steps:
      - name: Print the secrets and variables at scope REPO
        run: |
               echo "Scope: Repo, Printing Secrets and vars"
               echo "Full URL -> ${{vars.ENV_BASE_URL}}${{vars.ENV_API_BASE_PATH}}"
               echo "Pwd -> ${{secrets.USER_TEST1_PWD}}
               
  test1_secretsAndEnvs:
    runs-on: ubuntu-latest
    environment: test1
    env:
      INSCRIPT_ENV1 : INSCRIPT_VAL1
      INSCRIPT_ENV2 : INSCRIPT_VAL2
    steps:
      - name: Print the secrets and variables at scope ENV-test1
        run: |
              echo "Scope: Env-test1, Printing Secrets and vars"
              echo "test1.ENV_BASE_URL  : ${{vars.ENV_BASE_URL}}"
              echo "test1.USER_TEST1_PWD : ${{secrets.USER_TEST1_PWD}}"

  test2_secretsAndEnvs:
    runs-on: ubuntu-latest
    environment: test2
    steps:
      - name: Print the secrets and variables at scope ENV-test2
        run: |
              echo "Scope: Env-test2, Printing Secrets and vars"
              echo "test1.ENV_BASE_URL  : ${{vars.ENV_BASE_URL}}"
              echo "test1.USER_TEST1_PWD : ${{secrets.USER_TEST1_PWD}}"
           
      
      
      
